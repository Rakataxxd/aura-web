name = "aura-ranking"
main = "src/index.js"
compatibility_date = "2026-08-01"

# El backend tiene nombre propio. `custom_domain` hace que wrangler cree solo
# el registro DNS en la zona: no hay que tocar el panel.
routes = [
  { pattern = "api.auratester.com", custom_domain = true },
]



# OBLIGATORIO cuando hay `routes`: sin esto wrangler APAGA la url workers.dev,
# y el sitio de GitHub Pages —que le pega ahi— se queda sin backend en el mismo
# deploy. Ya paso una vez.
workers_dev = true

# El binding se llama DB en el codigo. `database_id` sale de crear la base:
#   npx wrangler d1 create aura-ranking
# y se pega aca. Despues, una sola vez:
#   npx wrangler d1 execute aura-ranking --remote --file=./schema.sql
[[d1_databases]]
binding = "DB"
database_name = "aura-ranking"
database_id = "9b4395e4-ee51-49b9-8a2b-467f50604e8f"

# Salas de batalla. `new_sqlite_classes` y no `new_classes`: los Durable
# Objects respaldados por SQLite entran en el plan gratis, los de KV no.
[[durable_objects.bindings]]
name = "SALAS"
class_name = "Sala"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sala", "Lobby"]

# SECRETOS (no van acá: `[vars]` se publica en texto plano en el dashboard).
# Se ponen una vez con:
#   npx wrangler secret put ADMIN_CLAVE     # la clave del panel de /admin
#   npx wrangler secret put SAL_VISITANTE   # cualquier cadena larga al azar
#
# ADMIN_CLAVE:   sin esto, /api/admin/stats contesta 401 SIEMPRE y el panel no
#                sirve. Es a proposito: un panel que se abre solo porque nadie
#                configuro la clave es peor que no tener panel.
# SAL_VISITANTE: es lo que hace que el hash del visitante no se pueda volver
#                atras. Sin ella se usa 'sin-sal', que con una tabla de IPs en
#                la mano es reversible: quien despliegue esto la tiene que
#                poner. Cambiarla despues no rompe nada, solo corta la
#                continuidad de "personas unicas" con lo de antes.
#
# En local van en `worker/.dev.vars` (ignorado por git), una por linea:
#   ADMIN_CLAVE="loquesea"
#   SAL_VISITANTE="otra-cosa-larga"

[vars]
# Origenes que pueden pegarle. Se compara EXACTO contra el header Origin.
# Si publicas en otro lado, agregalo aca separado por coma.
ORIGENES = "https://rakataxxd.github.io,https://auratester.com,https://www.auratester.com,http://localhost:5199,http://localhost:5173,http://127.0.0.1:8788"
