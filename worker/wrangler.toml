name = "aura-ranking"
main = "src/index.js"
compatibility_date = "2026-08-01"

# El backend tiene nombre propio. `custom_domain` hace que wrangler cree solo
# el registro DNS en la zona: no hay que tocar el panel.
routes = [
  { pattern = "api.auratester.com", custom_domain = true },
  # EL MISMO WORKER, TAMBIEN BAJO EL DOMINIO DEL SITIO.
  #
  # POR QUE, si ya tiene api.auratester.com: porque un video servido desde OTRO
  # host que la pagina es "media de terceros", y eso es exactamente lo que los
  # bloqueadores existen para bloquear. Paso de verdad: la tabla del torneo
  # cargaba (JSON chico, nadie lo mira) y el video no, en un navegador con
  # Shields agresivos —imposible de reproducir desde afuera porque depende del
  # perfil de cada uno—. Desde el mismo dominio es contenido propio del sitio y
  # ningun bloqueador lo toca.
  #
  # Pages sigue sirviendo todo lo demas: una ruta de Worker solo se lleva las
  # URLs que le calzan, y el sitio no usa /api/ para nada mas.
  { pattern = "auratester.com/api/*", zone_name = "auratester.com" },
  { pattern = "www.auratester.com/api/*", zone_name = "auratester.com" },
]



# OBLIGATORIO cuando hay `routes`: sin esto wrangler APAGA la url workers.dev,
# y el sitio de GitHub Pages —que le pega ahi— se queda sin backend en el mismo
# deploy. Ya paso una vez.
workers_dev = true

# El binding se llama DB en el codigo. `database_id` sale de crear la base:
#   npx wrangler d1 create aura-ranking
# y se pega aca. Despues, una sola vez:
#   npx wrangler d1 execute aura-ranking --remote --file=./schema.sql
[[d1_databases]]
binding = "DB"
database_name = "aura-ranking"
database_id = "9b4395e4-ee51-49b9-8a2b-467f50604e8f"

# Salas de batalla. `new_sqlite_classes` y no `new_classes`: los Durable
# Objects respaldados por SQLite entran en el plan gratis, los de KV no.
[[durable_objects.bindings]]
name = "SALAS"
class_name = "Sala"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sala", "Lobby"]

# Los videos de los torneos duran 7 dias despues del cierre. Esto es lo que los
# borra. Una vez por hora alcanza: no hay nadie esperando que desaparezcan.
[triggers]
crons = ["0 * * * *"]

# VIDEOS DE LOS TORNEOS. Van en KV y NO en R2, a proposito.
#
# R2 seria el lugar correcto —10 GB gratis, pensado para archivos, con Range
# nativo—, pero habilitarlo obliga a aceptar sus terminos y dejar una TARJETA en
# la cuenta, aunque despues nunca cobre nada. KV entra en el plan gratis de
# Workers sin pedir nada: 1 GB, valores de hasta 25 MB y expiracion por TTL.
#
# La cuenta, con numeros medidos y no estimados: un clip de 15s a 720p60 con
# movimiento pesado pesa 5.3 MB (ver el bitrate en src/record.js). 1 GB da para
# ~190 videos, y con el tope de 10 por torneo son ~19 torneos con video a la
# vez. Si algun dia queda chico, se habilita R2 y se ata como CLIPS_R2: el
# adaptador de src/almacen.js lo prefiere solo y no hay nada mas que cambiar.
#
# El TTL de KV es lo que borra los videos a los 7 dias del cierre. El cron
# sigue existiendo, pero solo para limpiar la marca en la tabla.
[[kv_namespaces]]
binding = "CLIPS"
id = "040ddbaecec74ecea39b9de229e31760"

# Si algun dia se habilita R2, descomentar esto y listo: gana sobre KV solo.
# [[r2_buckets]]
# binding = "CLIPS_R2"
# bucket_name = "aura-clips"

# SECRETOS (no van acá: `[vars]` se publica en texto plano en el dashboard).
# Se ponen una vez con:
#   npx wrangler secret put ADMIN_CLAVE     # la clave del panel de /admin
#   npx wrangler secret put SAL_VISITANTE   # cualquier cadena larga al azar
#
# ADMIN_CLAVE:   sin esto, /api/admin/stats contesta 401 SIEMPRE y el panel no
#                sirve. Es a proposito: un panel que se abre solo porque nadie
#                configuro la clave es peor que no tener panel.
# SAL_VISITANTE: es lo que hace que el hash del visitante no se pueda volver
#                atras. Sin ella se usa 'sin-sal', que con una tabla de IPs en
#                la mano es reversible: quien despliegue esto la tiene que
#                poner. Cambiarla despues no rompe nada, solo corta la
#                continuidad de "personas unicas" con lo de antes.
#
# En local van en `worker/.dev.vars` (ignorado por git), una por linea:
#   ADMIN_CLAVE="loquesea"
#   SAL_VISITANTE="otra-cosa-larga"

[vars]
# Origenes que pueden pegarle. Se compara EXACTO contra el header Origin.
# Si publicas en otro lado, agregalo aca separado por coma.
ORIGENES = "https://rakataxxd.github.io,https://auratester.com,https://www.auratester.com,https://auratester.pages.dev,https://casa.auratester.com,http://localhost:5199,http://localhost:5173,http://127.0.0.1:8788"
